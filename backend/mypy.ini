# Type-checked modules: the platform layers added for the SaaS (identity,
# storage, auth, quotas, queue, observability) and the sandbox boundary.
# Older modules join this list as they gain annotations.
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
# backend/ is the import root (PYTHONPATH=/app in the image).
explicit_package_bases = True
# Only the listed files are reported; imported legacy modules are analysed silently.
follow_imports = silent
mypy_path = .
files = storage, identity, orchestrator/auth.py, orchestrator/quotas.py, orchestrator/dispatcher.py,
        orchestrator/tenancy.py, orchestrator/metrics.py, orchestrator/observability.py, orchestrator/tracing.py,
        orchestrator/schemas.py, orchestrator/api_models.py, orchestrator/admin_api.py, orchestrator/config.py,
        gatekeeper/audited_sandbox.py, gatekeeper/sandbox_client.py
