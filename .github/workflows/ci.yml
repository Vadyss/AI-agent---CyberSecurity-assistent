name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same image and user (root) as local runs, so sandbox UID-isolation
      # tests execute instead of being skipped on the unprivileged runner.
      - name: Backend and sandbox tests (python:3.12-slim)
        run: sh backend/scripts/test.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relay tests (offline)
        working-directory: apify/llm-relay
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  integration:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Throwaway database of the isolated CI stack; never a deployment secret.
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke client
        run: pip install -r backend/requirements.txt
      - name: Start isolated mock backend and sandbox
        run: docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml up --build -d --wait backend sandbox
      - name: Build frontend and start isolated nginx
        run: |
          docker build -t frankenstein-ci-frontend ./frontend
          docker run -d --name frankenstein-ci-proxy --network frankenstein-ci_default -p 127.0.0.1:13000:8080 frankenstein-ci-frontend
      - name: Frontend health and nginx HTTP/WebSocket smoke
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:13000/
          curl --fail http://localhost:13000/api/health
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health
          python backend/scripts/smoke_e2e.py --base http://localhost:13000 --idle-before-run 180
      - name: Isolated sandbox security checks
        run: |
          sandbox=$(docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml ps -q sandbox)
          if [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$sandbox")" != none ]; then
            echo "FAIL: test sandbox has a network"; exit 1
          fi
          if [ "$(docker exec "$sandbox" sh -c 'grep CapEff /proc/1/status | cut -f2')" != 00000000000000e0 ]; then
            echo "FAIL: test sandbox capabilities are not exactly SETUID, SETGID and KILL"; exit 1
          fi
          if docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml exec -T sandbox printenv APIFY_TOKEN > /dev/null; then
            echo "FAIL: test sandbox has API key"; exit 1
          fi
          if docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml exec -T sandbox python -c "import urllib.request; urllib.request.urlopen('http://1.1.1.1', timeout=5)" > /dev/null 2>&1; then
            echo "FAIL: test sandbox has internet access"; exit 1
          fi
          if docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml exec -T sandbox touch /app/test > /dev/null 2>&1; then
            echo "FAIL: test sandbox filesystem is writable"; exit 1
          fi
      - name: Integration diagnostics
        if: failure()
        run: docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml logs --tail 200 backend sandbox
      - name: Remove isolated test containers
        if: always()
        run: |
          docker rm -f frankenstein-ci-proxy || true
          docker compose -p frankenstein-ci -f docker-compose.yml -f docker-compose.demo.yml down

  auth-integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke client
        run: pip install httpx==0.28.1 websockets==15.0.1
      - name: Start the development stack with oauth2-proxy and the mock provider
        run: sh scripts/dev-up.sh .ci.env
      - name: Sign-in chain, API keys, tenant refusal and WebSocket origin checks
        run: python scripts/auth_smoke.py
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file .ci.env -p toolsmith-dev -f docker-compose.yml -f docker-compose.dev.yml logs --tail 200
      - name: Remove the stack
        if: always()
        run: docker compose --env-file .ci.env -p toolsmith-dev -f docker-compose.yml -f docker-compose.dev.yml down -v

  deploy:
    needs: [test, frontend-test, integration, auth-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up --build -d
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OAUTH2_PROXY_COOKIE_SECRET: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
          OIDC_JWKS_URL: ${{ vars.OIDC_JWKS_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}

      - name: Backend health check
        run: |
          for attempt in $(seq 10); do
            docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" && exit 0
            sleep 3
          done
          exit 1

      - name: Public entry (oauth2-proxy) health check
        run: curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:4180/ping

      - name: Sandbox security checks
        run: |
          if [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' hackathon-sandbox-1)" != none ]; then
            echo "FAIL: sandbox has a network"; exit 1
          fi
          if [ "$(docker exec hackathon-sandbox-1 sh -c 'grep CapEff /proc/1/status | cut -f2')" != 00000000000000e0 ]; then
            echo "FAIL: sandbox capabilities are not exactly SETUID, SETGID and KILL"; exit 1
          fi
          if docker exec hackathon-sandbox-1 printenv APIFY_TOKEN > /dev/null; then
            echo "FAIL: sandbox has API key"; exit 1
          fi
          if docker exec hackathon-sandbox-1 python -c "import urllib.request; urllib.request.urlopen('http://1.1.1.1', timeout=5)" > /dev/null 2>&1; then
            echo "FAIL: sandbox has internet access"; exit 1
          fi
          if docker exec hackathon-sandbox-1 touch /app/test > /dev/null 2>&1; then
            echo "FAIL: sandbox filesystem is writable"; exit 1
          fi
          echo "All sandbox security checks passed"
